# Login espalhado no dia (usuário "orgânico" no histórico de atividades).
# Secrets necessários no repositório:
#   ORGANIC_API_URL      — URL da API (ex.: https://api-sost-dashboard.vercel.app)
#   ORGANIC_USERNAME     — usuário (ex.: carlos_machado)
#   ORGANIC_PASSWORD     — senha desse usuário
#
# 4 janelas (horário de Brasília ≈ UTC−3), cada uma com jitter no script:
#   ~09:00 | ~11:30 | ~14:00 | ~17:00
# Com ~20% de chance de pular uma janela → em média 3–4 logins/dia.
#
# Rode também manualmente: Actions → Organic login → Run workflow

name: Organic login

on:
  schedule:
    - cron: '0 12 * * *' # ~09:00 BRT
    - cron: '30 14 * * *' # ~11:30 BRT
    - cron: '0 17 * * *' # ~14:00 BRT
    - cron: '0 20 * * *' # ~17:00 BRT
  workflow_dispatch:

concurrency:
  group: organic-login-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Login orgânico
        env:
          ORGANIC_API_URL: ${{ secrets.ORGANIC_API_URL }}
          ORGANIC_USERNAME: ${{ secrets.ORGANIC_USERNAME }}
          ORGANIC_PASSWORD: ${{ secrets.ORGANIC_PASSWORD }}
        run: node scripts/organic-login.mjs
